name: Validate AlexOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'migration/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Canonical gate: tests, lint, typecheck, build, and the
      # public-storefront immutability guard must all pass.
      - name: Run full verification
        run: npm run verify
        env:
          VITE_SUPABASE_URL: https://goafwbrayepaihxbqsse.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
