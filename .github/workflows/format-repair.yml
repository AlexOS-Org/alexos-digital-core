name: One-time formatting repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-repair:
    if: github.actor == 'dylextrends'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format files flagged by canonical lint
        run: npx prettier --write src/components/dashboard/MoneySnapshot.tsx src/components/debts/DebtFormDialog.tsx src/components/debts/DebtPaymentDialog.tsx src/components/modules/ModuleWorkbench.tsx src/components/money/AccountFormDialog.tsx src/lib/debts/api.ts vite.config.ts

      - name: Commit formatting and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/MoneySnapshot.tsx src/components/debts/DebtFormDialog.tsx src/components/debts/DebtPaymentDialog.tsx src/components/modules/ModuleWorkbench.tsx src/components/money/AccountFormDialog.tsx src/lib/debts/api.ts vite.config.ts
          git rm .github/workflows/format-repair.yml
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: normalize canonical formatting"
          git push origin HEAD:main
