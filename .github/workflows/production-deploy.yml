name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Do not deploy two main commits concurrently. A later commit waits for the
# earlier release to finish so schema and Worker versions remain ordered.
concurrency:
  group: alexos-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate Supabase and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      # Retained for audit compatibility; direct DB migration access below
      # intentionally does not depend on this token's project permissions.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PROJECT_ID: goafwbrayepaihxbqsse
      SUPABASE_URL: https://goafwbrayepaihxbqsse.supabase.co
      VITE_SUPABASE_URL: https://goafwbrayepaihxbqsse.supabase.co
      VITE_SUPABASE_PROJECT_ID: goafwbrayepaihxbqsse
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert this run is deploying main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

      - name: Check required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SUPABASE_DB_PASSWORD CLOUDFLARE_API_TOKEN VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            {
              echo "## Production deploy blocked"
              echo
              echo "The GitHub **production** environment is missing required Actions secrets."
              echo "Add them at **Settings → Environments → production → Environment secrets**."
              echo "Never put secret values in the repository, workflow logs, or issues."
              echo
              echo "Missing:"
              for name in "${missing[@]}"; do
                echo "- \`$name\`"
                echo "::error title=Missing GitHub production secret::Set $name in Settings → Environments → production"
              done
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run application verification
        run: npm run verify

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set up PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply post-baseline Supabase migrations directly
        shell: bash
        run: |
          set -euo pipefail
          migration_baseline=20260915085639

          export SUPABASE_DB_URL="$(python3 - <<'PY'
          import os
          from urllib.parse import quote
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          project = os.environ["SUPABASE_PROJECT_ID"]
          print(f"postgresql://postgres.{project}:{password}@aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require")
          PY
          )"

          # Apply only new post-baseline files transactionally. The remote
          # ledger contains historical versions whose local files were later
          # squashed or renamed, so db push cannot be used with a partial
          # migration directory. Record each successful file explicitly after
          # execution; reruns then skip versions already in the ledger.
          applied=0
          while IFS= read -r migration; do
            version="$(basename "$migration" | cut -d_ -f1)"
            if [[ "$version" > "$migration_baseline" ]] && [[ "$(basename "$migration")" != "20260901000000_dailygear_positive_order_price_guard.sql" ]]; then
              if supabase db query \
                --db-url "$SUPABASE_DB_URL" \
                --output csv \
                "select version from supabase_migrations.schema_migrations where version = '${version}' limit 1" \
                | grep -q "$version"; then
                echo "Migration $version already applied."
                continue
              fi

              psql "$SUPABASE_DB_URL" \
                --set ON_ERROR_STOP=1 \
                --single-transaction \
                --file "$migration"
              supabase migration repair \
                --db-url "$SUPABASE_DB_URL" \
                --status applied \
                --yes \
                "$version"
              applied=$((applied + 1))
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

          if [ "$applied" -eq 0 ]; then
            echo "No new post-baseline production migrations to apply."
          else
            echo "Applied $applied post-baseline production migration(s)."
          fi

      - name: Deploy the verified main build to Cloudflare Workers
        run: npm run deploy
